name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build:
    name: Compilar ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            project: src/Backend/SchoolGether.Api/SchoolGether.Api.csproj
          - name: Site
            project: src/Clients/SchoolGether.Web/SchoolGether.Web.csproj
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore "${{ matrix.project }}"

      - name: Compilar em Release
        run: dotnet build "${{ matrix.project }}" --configuration Release --no-restore

      - name: Restaurar ferramentas EF
        if: matrix.name == 'API'
        run: dotnet tool restore

      - name: Verificar correspondência entre modelo e migrações
        if: matrix.name == 'API'
        env:
          # Esta ligação só permite gerar o modelo; o check não acede ao servidor.
          ConnectionStrings__SchoolGether: 'Server=localhost;Database=schoolgether;User=design_only;'
        run: dotnet ef migrations has-pending-model-changes --project src/Backend/SchoolGether.Infrastructure --startup-project src/Backend/SchoolGether.Api --configuration Release --no-build

  domain-tests:
    name: Testes do domínio
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Testar em Release
        run: dotnet test tests/SchoolGether.Domain.Tests/SchoolGether.Domain.Tests.csproj --configuration Release
